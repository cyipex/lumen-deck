name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please do not include IP addresses, computer names or other personal data.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
        3. See …
  - type: input
    id: tablet
    attributes:
      label: Tablet or phone (model and Android version)
      placeholder: e.g. Huawei MediaPad T3 10, Android 7
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and Lumen Desk version
      placeholder: e.g. Windows 11 23H2, Lumen Desk 1.1.0
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options: [Wi-Fi, USB cable, Both / not sure]
  - type: textarea
    id: log
    attributes:
      label: Server log (optional)
      description: Lumen Desk settings → Tablet → Server status. Remove anything personal first.
      render: text
